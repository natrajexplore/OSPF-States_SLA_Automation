# Runs on the EVE-NG VM. `network_mode: host` gives the container direct access to
# both the EVE-NG REST API (127.0.0.1) and the router MGMT subnet (192.168.99.0/24
# on the pnet1 bridge).

services:
  ospf-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ospf-sla-executor:latest
    container_name: ospf-sla-executor
    network_mode: host
    restart: unless-stopped
    env_file: .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010"]
    volumes:
      # live-editable without a rebuild
      - ./backend/inventory.yaml:/app/inventory.yaml:ro
      - ./backend/templates:/app/templates:ro
      - ./backend/scenarios:/app/scenarios:ro
      - ./backend/baseline:/app/baseline:ro
      - ospf_runs:/app/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # React UI: nginx serves the build and proxies /api (incl. SSE) to the backend on 127.0.0.1:8010.
  # http://<eve-vm>:8082  (EVE-NG itself uses 80/443; 8000/8081 are taken by the sibling BGP-Attributes stack on this VM)
  ospf-ui:
    build:
      context: ./frontend
    image: ospf-sla-ui:latest
    container_name: ospf-sla-ui
    network_mode: host
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://127.0.0.1:8010
      UI_PORT: "8082"
    depends_on: [ospf-backend]

volumes:
  ospf_runs:
