title: "NSSA - R4 injects an external prefix from inside area 1 (type 7 becomes type 5 at the ABR)"
concept: nssa
summary: >
  Area 1 is turned into an NSSA on R2, R3 and R4. R4 redistributes its Loopback1 (10.4.4.0/24) as an
  external route: inside the NSSA it is a type-7 LSA (`O N2` on the ABRs). R3, the ABR with the highest
  router-id, is elected translator and floods it into area 0 as a type-5 LSA, so R1 sees `O E2`.
  Run 04 (stub) rollback first: an area cannot be stub and NSSA at once. Do not run together with 03
  (both use Loopback1). Rollback removes the redistribution and the area type.
template: 06_nssa.j2
targets: [R2, R3, R4]
settle_seconds: 70
verify:
  - device: R3
    command: "show ip route ospf"
    expect_regex: 'O N2\s+10\.4\.4\.0/24'
  - device: R1
    command: "show ip route ospf"
    expect_regex: 'O E2\s+10\.4\.4\.0/24'
  - device: R3
    command: "show ip ospf neighbor"
    expect_regex: '10\.255\.0\.4\s+\d+\s+FULL'
rollback_verify:
  - device: R1
    command: "show ip route ospf"
    must_not_match: 'O E2\s+10\.4\.4\.0/24'
  - device: R3
    command: "show ip route ospf"
    must_not_match: 'O N2\s+10\.4\.4\.0/24'
  - device: R3
    command: "show ip ospf neighbor"
    expect_regex: '10\.255\.0\.4\s+\d+\s+FULL'
